<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 144" width="620" height="144" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19142D"/>
      <stop offset="35%" stop-color="#B45023"/>
      <stop offset="65%" stop-color="#F08C2D"/>
      <stop offset="100%" stop-color="#FFC350"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="40%" stop-color="#FFAA40"/>
      <stop offset="100%" stop-color="#FFAA40" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Gradient -->
  <rect width="620" height="144" fill="url(#sky)"/>

  <!-- Setting Sun Glow -->
  <circle cx="320" cy="84" r="54" fill="url(#sun)"/>
  <circle cx="320" cy="84" r="22" fill="#FFE890"/>

  <!-- Back Mountains -->
  <polygon points="0,144 0,80 75,68 160,78 240,62 330,75 420,64 510,72 620,60 620,144" fill="#3A202A"/>

  <!-- Front Mountains -->
  <polygon points="0,144 0,96 90,84 190,92 280,80 370,88 470,82 560,90 620,85 620,144" fill="#28161E"/>

  <!-- Transmission Satellite Dish Silhouette -->
  <g fill="#160E12" stroke="#160E12" stroke-linecap="round">
    <line x1="242" y1="112" x2="254" y2="80" stroke-width="3"/>
    <line x1="278" y1="112" x2="266" y2="80" stroke-width="3"/>
    <line x1="246" y1="98" x2="274" y2="98" stroke-width="2"/>
    <path d="M 224 82 A 38 38 0 0 1 296 82" fill="none" stroke-width="5"/>
    <line x1="260" y1="84" x2="276" y2="58" stroke-width="3"/>
    <circle cx="276" cy="58" r="4" fill="#160E12"/>
  </g>

  <!-- Mining Monument Crane Tower -->
  <g fill="#160E12">
    <rect x="374" y="72" width="20" height="45"/>
    <polygon points="370,72 398,72 394,60 374,60"/>
    <rect x="378" y="52" width="12" height="8"/>
    <line x1="384" y1="52" x2="384" y2="38" stroke="#160E12" stroke-width="2"/>
  </g>

  <!-- Powerlines / Pylons -->
  <g stroke="#181014" stroke-width="2">
    <line x1="72" y1="110" x2="78" y2="65"/>
    <line x1="88" y1="110" x2="82" y2="65"/>
    <line x1="66" y1="78" x2="94" y2="78"/>
    <line x1="62" y1="90" x2="98" y2="90"/>

    <line x1="535" y1="112" x2="541" y2="68"/>
    <line x1="551" y1="112" x2="545" y2="68"/>
    <line x1="529" y1="80" x2="557" y2="80"/>
    <line x1="525" y1="92" x2="561" y2="92"/>
  </g>

  <!-- Pine Tree Silhouettes -->
  <polygon points="0,144 0,110 8,98 16,114 24,94 32,112 44,90 56,115 70,96 85,116 102,92 118,118 135,95 150,116 170,90 190,115 215,92 235,116 260,94 285,118 310,92 335,117 360,93 385,116 410,90 435,115 460,92 485,116 510,93 535,118 560,91 585,117 605,94 620,112 620,144" fill="#120C10"/>

  <!-- Foreground Dark Ground -->
  <rect x="0" y="126" width="620" height="18" fill="#0E090C"/>
</svg>
